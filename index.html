<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Push Pull Legs</title>
<meta name="description" content="3-day Push / Pull / Legs routine with a guided workout player, rep and weight logging, PR alerts and rest timer.">
<meta name="theme-color" content="#0b0b0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PPL">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0b0c'/%3E%3Cpath d='M12 26h6v12h-6zM46 26h6v12h-6zM18 22h5v20h-5zM41 22h5v20h-5zM23 30h18v4H23z' fill='%23d7ff3a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0c; --surface:#161618; --surface-2:#202023; --line:#2b2b2f; --text:#f5f5f4; --muted:#8e8e96;
  --accent:#d7ff3a; --on-accent:#0b0b0c; --accent-ink:#d7ff3a; --danger:#ff5a4e;
  --scrim:rgba(0,0,0,.7);
}
:root[data-theme="light"]{
  --bg:#f3f3f0; --surface:#ffffff; --surface-2:#ebebe7; --line:#dcdcd6; --text:#0b0b0c; --muted:#6b6b72;
  --accent:#d7ff3a; --on-accent:#0b0b0c; --accent-ink:#4f6b00; --danger:#d0342a; --scrim:rgba(0,0,0,.45);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.d{font-family:"Barlow Condensed",Inter,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.01em;line-height:.95}
.wrap{max-width:640px;margin:0 auto;padding:14px 16px 110px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.brand{font-weight:800;font-size:22px;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;background:var(--accent);border-radius:2px;display:inline-block}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:12px;font-weight:600;color:var(--muted)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.wd{background:none;border:0;padding:6px 0 8px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600}
.wd .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:14px;color:var(--text);border:1.5px solid transparent}
.wd.today .n{border-color:var(--accent)}
.wd.sel .n{background:var(--accent);color:var(--on-accent)}
.wd .dot{width:5px;height:5px;border-radius:50%;background:var(--line)}
.wd.train .dot{background:var(--muted)}
.wd.done .dot{background:var(--accent)}
.wd:disabled{cursor:default;opacity:.55}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px 18px 18px}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(215,255,58,.18),transparent 70%);pointer-events:none}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink)}
.hero h1{font-size:64px;margin:6px 0 4px;font-weight:800}
.hero .sub{color:var(--muted);font-size:14px}
.stats{display:flex;gap:18px;margin:16px 0 18px}
.stat b{display:block;font-size:26px;font-weight:800}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.cta{width:100%;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);padding:16px;font-weight:800;font-size:20px}
.cta:active{transform:scale(.99)}
.links{display:flex;gap:16px;margin-top:12px;font-size:13px}
.links a{color:var(--muted);text-decoration:none;font-weight:600}
.links a:hover{color:var(--text)}

/* day chips */
.chips{display:flex;gap:8px;margin:18px 0 10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font-weight:700;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}

/* exercise list */
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 2px 10px}
.sec h2{font-size:24px;margin:0;font-weight:800}
.sec span{color:var(--muted);font-size:12px}
.row{display:flex;gap:14px;align-items:center;padding:13px 14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:8px}
.row .i{width:30px;height:30px;flex:none;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-weight:800;font-size:16px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--muted);font-size:13px}
.row .last{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap}
.row .last b{display:block;color:var(--text);font-size:14px}
.row.warm{background:transparent;border-style:dashed}
.row.warm .i{background:transparent;border:1px dashed var(--line)}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:8px 16px calc(8px + env(safe-area-inset-bottom));z-index:20}
.nav button{flex:1;max-width:200px;border:0;background:none;padding:8px;border-radius:12px;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;text-transform:uppercase;letter-spacing:.06em}
.nav button[aria-current="true"]{color:var(--text)}
.nav button[aria-current="true"] svg{stroke:var(--accent-ink)}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* progress */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.kpi b{font-size:34px;font-weight:800;display:block}
.kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.prow{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.prow .t{flex:1;min-width:0}
.prow .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .t small{color:var(--muted);font-size:12px}
.prow svg{width:84px;height:30px;flex:none}
.prow .best{text-align:right;min-width:64px}
.prow .best b{display:block;font-size:20px;font-weight:800}
.prow .best small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.empty{color:var(--muted);text-align:center;padding:28px 10px;border:1px dashed var(--line);border-radius:16px;font-size:14px}
.ghost{border:1px solid var(--line);background:none;border-radius:12px;padding:10px 14px;font-weight:600;font-size:13px;color:var(--muted)}

/* player */
.player{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;flex-direction:column}
.player.open{display:flex}
.p-head{padding:calc(10px + env(safe-area-inset-top)) 16px 8px;max-width:640px;width:100%;margin:0 auto}
.segs{display:flex;gap:4px;margin-bottom:12px}
.segs i{flex:1;height:4px;border-radius:9px;background:var(--surface-2);overflow:hidden;position:relative}
.segs i b{position:absolute;inset:0;right:auto;background:var(--accent);border-radius:9px}
.segs i.cur{outline:1px solid var(--muted);outline-offset:1px}
.p-bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px}
.p-body{flex:1;overflow:auto;padding:4px 16px 20px;max-width:640px;width:100%;margin:0 auto}
.p-body h2{font-size:46px;margin:10px 0 6px;font-weight:800}
.target{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.target span{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:600}
.target span.hi{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.how{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px;margin-bottom:16px}
.how summary{cursor:pointer;list-style:none;font-weight:700;font-size:14px;padding:10px 0;display:flex;justify-content:space-between}
.how summary::-webkit-details-marker{display:none}
.how summary::after{content:"+";color:var(--accent-ink);font-weight:800}
.how[open] summary::after{content:"2"}
.how ol{margin:0 0 10px;padding-left:20px;font-size:14px}
.how li{margin:0 0 6px}
.how .alt{font-size:13px;color:var(--muted);margin:0 0 12px}
.how .alt b{color:var(--text)}
.demo{display:inline-flex;align-items:center;gap:8px;border-radius:99px;background:var(--text);color:var(--bg);text-decoration:none;font-weight:700;font-size:13px;padding:9px 14px;margin-bottom:12px}
.row{cursor:pointer}
.p-links{display:flex;gap:14px;font-size:13px;margin-bottom:16px}
.p-links a{color:var(--accent-ink);font-weight:700;text-decoration:none}
.sethead,.set{display:grid;grid-template-columns:44px 1fr 1fr 1fr 52px;gap:8px;align-items:center}
.sethead{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;padding:0 4px 6px}
.set{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 4px;margin-bottom:8px}
.set .sn{text-align:center;font-weight:800;font-size:22px}
.set .prev{font-size:13px;color:var(--muted);text-align:center}
.set input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:700 17px Inter,system-ui,sans-serif;text-align:center;padding:0 4px}
.set input::placeholder{color:var(--muted);opacity:.6}
.set input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.set .ck{height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);display:grid;place-items:center}
.set .ck svg{width:20px;height:20px;fill:none;stroke:var(--muted);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.set.done{border-color:var(--accent)}
.set.done .ck{background:var(--accent);border-color:var(--accent)}
.set.done .ck svg{stroke:var(--on-accent)}
.set.done input{border-color:transparent;background:transparent}
.notes{width:100%;min-height:56px;margin-top:8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:14px Inter,system-ui,sans-serif;padding:10px 12px;resize:vertical}
.p-foot{display:flex;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom));max-width:640px;width:100%;margin:0 auto;border-top:1px solid var(--line)}
.p-foot button{border-radius:14px;padding:14px;font-weight:800;font-size:18px;border:1px solid var(--line);background:var(--surface)}
.p-foot .next{flex:1;background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.p-foot .prv{width:64px}
.p-foot button:disabled{opacity:.35;cursor:default}

/* rest sheet */
.rest{position:fixed;inset:0;z-index:50;background:var(--scrim);display:none;align-items:flex-end;justify-content:center}
.rest.open{display:flex}
.sheet{background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;width:100%;max-width:640px;padding:22px 20px calc(20px + env(safe-area-inset-bottom));text-align:center}
.ring{position:relative;width:200px;height:200px;margin:8px auto 10px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}
.ring .bgc{stroke:var(--surface-2)}
.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring .tm{position:absolute;inset:0;display:grid;place-items:center;font-size:64px;font-weight:800;font-variant-numeric:tabular-nums}
.upnext{color:var(--muted);font-size:14px;margin-bottom:16px}
.upnext b{color:var(--text)}
.sheet .btns{display:flex;gap:8px}
.sheet .btns button{flex:1;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-weight:800;font-size:18px}
.sheet .btns .skip{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

/* toast + summary */
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top));transform:translate(-50%,-140%);background:var(--accent);color:var(--on-accent);padding:12px 18px;border-radius:14px;font-weight:800;font-size:20px;z-index:70;transition:transform .3s cubic-bezier(.2,.9,.3,1.3);white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.toast.show{transform:translate(-50%,0)}
.modal{position:fixed;inset:0;z-index:60;background:var(--scrim);display:none;place-items:center;padding:16px}
.modal.open{display:grid}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:26px 20px 20px;width:100%;max-width:420px;text-align:center}
.card h3{font-size:48px;margin:6px 0 14px;font-weight:800}
.card .kpis{margin-bottom:18px;text-align:left}
.install{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--accent);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:13px}
.install img{width:40px;height:40px;border-radius:10px;flex:none}
.install b{display:block;font-size:14px}
.install span{color:var(--muted)}
.install button{margin-left:auto;background:none;border:0;color:var(--muted);font-size:18px;padding:4px}
/* warm-ups + plates */
.muted{color:var(--muted)}
.aux{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;margin-bottom:12px}
.aux-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:8px}
.aux-h span{color:var(--muted);font-size:12px}
.linkbtn{background:none;border:0;color:var(--accent-ink);font-weight:700;font-size:12px;padding:2px 0}
.wu{display:flex;flex-wrap:wrap;gap:6px;font-size:13px}
.wset{border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:7px 10px;text-align:left;line-height:1.2}
.wset b{font-size:15px}
.wset small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
.wset.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.wset.on small{color:var(--on-accent);opacity:.7}
.bar{display:flex;align-items:center;gap:2px;height:72px;margin-bottom:6px}
.sleeve{width:44px;height:8px;background:var(--muted);border-radius:2px;opacity:.6}
.collar{width:8px;height:16px;background:var(--muted);border-radius:2px}
.pl{font-style:normal;width:22px;border-radius:4px;background:var(--text);color:var(--bg);display:grid;place-items:center;font-size:10px;font-weight:800;letter-spacing:-.03em}
.pl:first-of-type{background:var(--accent);color:var(--on-accent)}
.ptxt{font-size:14px}
.pcin{width:100%;height:56px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:800 28px Inter,system-ui,sans-serif;text-align:center;margin-bottom:6px}
/* targets, wins, history, backup */
.row .last .tg{display:block;color:var(--accent-ink);font-size:15px;font-weight:700}
.row .last .tg.up::before{content:"↑ "}
.target span.tgt{background:transparent;border-color:var(--accent);color:var(--accent-ink)}
.wins{text-align:left;margin:0 0 18px;display:flex;flex-direction:column;gap:6px}
.win{display:flex;gap:10px;align-items:center;background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600}
.win i{font-style:normal;flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:13px;font-weight:800}
.win.big{background:var(--accent);color:var(--on-accent)}
.win.big i{background:var(--on-accent);color:var(--accent)}
.kpis.k4{grid-template-columns:repeat(4,1fr)}
.kpis.k4 b{font-size:28px}
.kpis.k4 .kpi{padding:12px 10px}
.hrow{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px}
.hrow .dt{width:44px;flex:none;text-align:center;line-height:1}
.hrow .dt b{display:block;font-size:24px;font-weight:800}
.hrow .dt small{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700}
.hrow .t{flex:1;min-width:0}
.hrow .t b{display:block;font-weight:700}
.hrow .t small{color:var(--muted);font-size:12px}
.hrow .w{font-size:12px;font-weight:700;color:var(--accent-ink);white-space:nowrap}
.card.scroll{max-height:86vh;overflow:auto;text-align:left}
.hx{margin:14px 0 6px;font-weight:700;font-size:14px}
.hset{display:grid;grid-template-columns:28px 1fr 1fr;gap:8px;align-items:center;margin-bottom:6px}
.hset span{color:var(--muted);font-weight:800;text-align:center}
.hset input{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:600 16px Inter,system-ui,sans-serif;text-align:center;width:100%}
.btnrow{display:flex;gap:8px;margin-top:16px}
.btnrow button{flex:1;border-radius:12px;padding:12px;font-weight:700;border:1px solid var(--line);background:var(--surface-2)}
.btnrow .pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btnrow .del{color:var(--danger)}
.bk{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:8px}
.bk p{margin:0 0 10px;color:var(--muted);font-size:13px}
.bk p b{color:var(--text)}
.nudge{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px dashed var(--accent);border-radius:14px;padding:10px 12px;margin-bottom:14px;font-size:13px}
.nudge span{flex:1;color:var(--muted)}
.nudge span b{color:var(--text)}
.nudge button{border:0;border-radius:10px;background:var(--accent);color:var(--on-accent);font-weight:800;padding:8px 12px;font-size:13px}
@media (max-width:380px){ .hero h1{font-size:54px} .p-body h2{font-size:38px} .sethead,.set{grid-template-columns:36px 1fr 1fr 1fr 46px;gap:6px} }
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div class="brand d"><i></i>Push · Pull · Legs</div>
    <div style="display:flex;gap:6px">
      <button class="pill" id="unitBtn" aria-label="Switch weight unit">LB</button>
      <button class="pill" id="themeBtn" aria-label="Toggle light mode">◐</button>
    </div>
  </div>

  <div class="install" id="install" hidden>
    <img src="apple-touch-icon.png" alt="">
    <div><b>Install as an app</b><span>Tap Share <svg width="13" height="15" viewBox="0 0 24 28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M12 2v15M7 7l5-5 5 5M5 12H3v14h18V12h-2"/></svg> then "Add to Home Screen"</span></div>
    <button id="installX" aria-label="Dismiss">✕</button>
  </div>

  <!-- WORKOUT VIEW -->
  <section id="vHome">
    <div class="nudge" id="nudge" hidden><span id="nudgeTxt"></span><button id="nudgeBtn">Back up</button></div>
    <div class="week" id="week"></div>
    <div class="hero">
      <div class="eyebrow" id="hEyebrow"></div>
      <h1 class="d" id="hTitle"></h1>
      <div class="sub" id="hSub"></div>
      <div class="stats" id="hStats"></div>
      <button class="cta d" id="startBtn">Start workout</button>
      <div class="links">
        <a href="#" id="formLink">Form guide</a>
        <a href="#" id="plateLink">Plate calc</a>

<script>
const PLAN = {
  push:{title:"Push", sub:"Chest · Shoulders · Triceps", ex:[
    {n:"Barbell Incline Bench Press", s:4, r:"6–10", g:"Upper chest", rest:120, tip:"In the rack. Shoulder blades pinched, bar touches upper chest."},
    {n:"Flat Dumbbell Press", s:3, r:"8–12", g:"Chest", rest:90},
    {n:"Seated Dumbbell Shoulder Press", s:3, r:"8–12", g:"Shoulders", rest:90},
    {n:"Pec Deck or Cable Fly", s:3, r:"12–15", g:"Chest", rest:60},
    {n:"Cable Lateral Raise", s:3, r:"12–20 / arm", g:"Side delts", rest:60, tip:"Lead with the elbow, stop around shoulder height."},
    {n:"Rope Triceps Pushdown", s:3, r:"10–15", g:"Triceps", rest:60, tip:"Superset with the next exercise to save time."},
    {n:"Overhead Cable Triceps Extension", s:3, r:"10–15", g:"Triceps", rest:60}
  ]},
  pull:{title:"Pull", sub:"Back · Rear delts · Biceps", ex:[
    {n:"Lat Pulldown", s:4, r:"8–12", g:"Lats", rest:120, tip:"Chest up, pull elbows down to your sides."},
    {n:"Seated Cable Row", s:3, r:"8–12", g:"Mid back", rest:90},
    {n:"One-arm Dumbbell Row", s:3, r:"8–12 / arm", g:"Lats", rest:90},
    {n:"Straight-arm Cable Pulldown", s:3, r:"12–15", g:"Lats", rest:60},
    {n:"Reverse Pec Deck", s:3, r:"15–20", g:"Rear delts", rest:60},
    {n:"Incline Dumbbell Curl", s:3, r:"10–12", g:"Biceps", rest:60, tip:"Superset with the next exercise to save time."},
    {n:"Cable or Dumbbell Hammer Curl", s:3, r:"10–15", g:"Biceps / forearms", rest:60}
  ]},
  legs:{title:"Legs", sub:"Quads · Hamstrings · Glutes · Calves", ex:[
    {n:"Barbell Back Squat", s:4, r:"6–10", g:"Quads", rest:180, tip:"In the rack. Brace, sit between your heels, knees track over toes."},
    {n:"Barbell Romanian Deadlift", s:3, r:"8–12", g:"Hamstrings", rest:120, tip:"Soft knees, push hips back until you feel the hamstring stretch."},
    {n:"Leg Press", s:3, r:"10–15", g:"Quads", rest:90},
    {n:"Seated or Lying Leg Curl", s:3, r:"10–15", g:"Hamstrings", rest:60},
    {n:"Leg Extension", s:3, r:"12–15", g:"Quads", rest:60},
    {n:"Standing or Seated Calf Raise", s:4, r:"10–15", g:"Calves", rest:60, tip:"Pause 1 sec at the bottom."}
  ]}
};
// Form guide, same order as PLAN: c = cues, a = alternative if the machine is taken, q = demo search
const FORM = {
  push:[
    {q:"barbell incline bench press", a:"Smith machine incline press.", c:["Set the bench to about 30 degrees in the rack. Grip just outside shoulder width.","Pin your shoulder blades back and down before you unrack, and keep them there.","Lower for 2 to 3 seconds to your upper chest, just below the collarbones. Forearms vertical at the bottom, press without bouncing."]},
    {q:"flat dumbbell bench press", a:"Chest press machine.", c:["Kick the dumbbells up off your knees as you lie back.","Feet planted, slight arch, elbows about 45 to 60 degrees from your torso.","Let the dumbbells sink to chest level for a full stretch, then press up and slightly in. Stop before they clank."]},
    {q:"seated dumbbell shoulder press", a:"Shoulder press machine.", c:["Bench almost upright, around 80 degrees, back flat on the pad.","Start with the dumbbells at ear level, palms forward or turned slightly in.","Press to just short of lockout. Keep ribs down so your lower back does not arch off the pad."]},
    {q:"pec deck fly", a:"Whichever of the two is free.", c:["Pec deck: handles at chest height, chest up, shoulders back against the pad.","Keep a slight bend in the elbows the whole set.","Open wide for a deep stretch, then bring your hands together in front of your chest and squeeze for 1 second."]},
    {q:"single arm cable lateral raise", a:"Dumbbell lateral raise.", c:["Pulley at the lowest setting, handle in the hand farthest from the stack.","Lean slightly away from the machine and lead the movement with your elbow.","Raise to shoulder height, no higher. Lower slowly and do not shrug."]},
    {q:"rope triceps pushdown", a:"Straight bar pushdown.", c:["Rope on a high pulley. Elbows tucked at your sides and they do not move.","Push down and spread the rope apart at the bottom, squeezing the triceps.","Superset with the next exercise: do a set of each back to back, then rest about 60 sec."]},
    {q:"overhead cable triceps extension rope", a:"Overhead dumbbell extension.", c:["Use the same rope, pulley set low or mid. Face away from the stack in a split stance.","Elbows point forward and stay close to your head.","Let your hands travel deep behind your head for the stretch, then extend fully and squeeze."]}
  ],
  pull:[
    {q:"lat pulldown", a:"Assisted pull-up machine with little or no assist.", c:["Grip slightly wider than shoulder width. Lock your thighs under the pad.","Lean back about 15 degrees and drive your elbows down to your sides, bringing the bar to your upper chest.","At the top, let your shoulder blades rise for a full stretch before the next rep."]},
    {q:"seated cable row v bar", a:"Seated row machine.", c:["Use the V handle. Sit tall with knees slightly bent.","Pull the handle to your lower ribs with elbows close to your body.","On the way back, let your shoulders reach forward for the stretch without rounding your lower back."]},
    {q:"single arm dumbbell row", a:"Single arm cable row.", c:["One hand and one knee on the bench, back flat.","Pull the dumbbell toward your hip in an arc, not straight up to your chest.","Let it hang fully at the bottom. If the heaviest dumbbells get easy, slow the lowering to 3 or 4 seconds."]},
    {q:"straight arm cable pulldown", a:"Dumbbell pullover on a flat bench.", c:["Straight bar or rope on a high pulley. Step back and hinge forward slightly.","Arms nearly straight with a soft bend in the elbows.","Sweep the bar down to your thighs using your lats, pause, then let it rise until you feel the stretch."]},
    {q:"reverse pec deck rear delt fly", a:"Cable face pull with a rope.", c:["Face the pad with handles at shoulder height.","Arms nearly straight. Sweep out and back, leading with your elbows.","Do not squeeze your shoulder blades hard. The rear delts should do the work."]},
    {q:"incline dumbbell curl", a:"Standing cable curl.", c:["Bench at 45 to 60 degrees so your arms hang behind your body.","Keep your elbows still and curl without swinging. Lower all the way for the full stretch.","Superset with the next exercise: do a set of each back to back, then rest about 60 sec."]},
    {q:"dumbbell hammer curl", a:"Whichever of the two is free.", c:["Palms facing each other the whole time. With a cable, use the rope on a low pulley.","Elbows pinned to your sides. Curl up, then control the way down.","Keep the tempo strict, no body swing."]}
  ],
  legs:[
    {q:"barbell back squat", a:"Smith machine squat.", c:["Bar across your upper traps in the rack, safeties set just below your bottom position.","Feet about shoulder width, toes slightly out. Big breath and brace before each rep.","Sit down between your feet to at least parallel, knees tracking over toes, then drive up through the middle of your foot."]},
    {q:"barbell romanian deadlift", a:"Dumbbell or Smith machine Romanian deadlift.", c:["Start standing with the bar at mid thigh and a soft bend in your knees.","Push your hips back and let the bar slide down your thighs with a flat back.","Stop when your hamstrings are fully stretched, usually around mid shin, then squeeze your glutes to stand."]},
    {q:"leg press", a:"Hack squat or Smith machine split squat.", c:["Feet shoulder width in the middle of the platform.","Lower as deep as you can without your lower back peeling off the pad.","Press up smoothly and stop just short of locking your knees."]},
    {q:"seated leg curl machine", a:"Whichever of the two is free.", c:["Line up your knee with the machine's pivot point. Pad just above your heels.","Curl all the way, pause briefly, then control the weight back up.","Seated gives a better stretch than lying if both are free."]},
    {q:"leg extension machine", a:"Goblet squat with heels raised.", c:["Knee lined up with the pivot, pad on your lower shin.","Hold the handles and sit back into the seat.","Extend fully, hold 1 second at the top, lower slowly."]},
    {q:"standing calf raise", a:"Calf press on the leg press.", c:["Balls of your feet on the platform edge or a plate.","Drop your heels for a full stretch and pause 1 second at the bottom.","Rise as high as you can onto your big toe. No bouncing."]}
  ]
};
Object.keys(FORM).forEach(d => FORM[d].forEach((f,i) => Object.assign(PLAN[d].ex[i], f)));
const demoUrl = e => "https://www.youtube.com/results?search_query="+encodeURIComponent((e.q||e.n)+" proper form");
const WEEK = ["push","rest","pull","rest","legs","rest","rest"]; // Mon..Sun
const WD = ["M","T","W","T","F","S","S"];
const DAYNAME = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
Object.values(PLAN).forEach(p => p.ex.forEach(e => e.k = e.n.toLowerCase().replace(/[^a-z0-9]+/g,"-")));

const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2,"0");
const localDate = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const now = new Date(), dow = (now.getDay()+6)%7, dateKey = localDate(now);
const e1 = (w,r) => (+w||0) * (1 + (+r||0)/30);           // Epley estimated 1RM
const lowRep = r => parseInt(r,10) || "";
const fmtT = s => Math.floor(s/60)+":"+pad(Math.max(0,s)%60);

let unit = store.get("ppl-unit","lb");
let log = store.get("ppl-log", {});          // { exKey: [{d, sets:[{w,r}]}] }
let done = store.get("ppl-done", {});        // { "2026-09-25": "legs" }
let notes = store.get("ppl-notes", {});      // { exKey: "text" }
let sess = store.get("ppl-session", null);   // in-progress workout
if(sess && sess.date !== dateKey) sess = null;

const hashDay = location.hash.slice(1);
let sel = PLAN[hashDay] ? hashDay : (sess ? sess.day : (WEEK[dow] !== "rest" ? WEEK[dow] : nextDay()));
function nextDay(){ for(let i=1;i<=7;i++){ const t = WEEK[(dow+i)%7]; if(t!=="rest") return t; } return "push"; }

/* ---------- theme + unit ---------- */
const root = document.documentElement;
if(store.get("ppl-theme",null)==="light") root.dataset.theme = "light";
$("#themeBtn").onclick = () => { const l = root.dataset.theme==="light"; if(l) delete root.dataset.theme; else root.dataset.theme="light"; store.set("ppl-theme", l ? "dark" : "light"); };
$("#unitBtn").textContent = unit.toUpperCase();
$("#unitBtn").onclick = () => { unit = unit==="lb" ? "kg" : "lb"; store.set("ppl-unit",unit); $("#unitBtn").textContent = unit.toUpperCase(); renderAll(); };

/* ---------- history helpers ---------- */
const lastEntry = k => { const h = log[k]; return h && h.length ? h[h.length-1] : null; };
const topSet = sets => sets.reduce((b,s) => (!b || e1(s.w,s.r) > e1(b.w,b.r)) ? s : b, null);
const bestE = k => Math.max(0, ...(log[k]||[]).flatMap(x => x.sets.map(s => e1(s.w,s.r))));
const setTxt = s => s ? (+s.w ? s.w+" × "+s.r : s.r+" reps") : "—";
const estMin = p => Math.round(5 + p.ex.reduce((m,e) => m + e.s*(45+e.rest), 0)/60);
let hist = store.get("ppl-hist", {});        // { "2026-09-25": {day, mins, wins:[...]} }
const prevEntry = k => { const h = (log[k]||[]).filter(x => x.d !== dateKey); return h.length ? h[h.length-1] : null; };
const rng = r => { const m = String(r).match(/(\d+)\D+(\d+)/); const n = parseInt(r,10) || 8; return m ? [+m[1], +m[2]] : [n, n]; };
const INC = () => unit === "kg" ? 2.5 : 5;
const vol = sets => sets.reduce((a,s) => a + (+s.w||0)*(+s.r||0), 0);

/* Progressive-overload target from a previous session:
   every set hit the top of the rep range -> add weight; otherwise -> one more rep. */
function targetFor(e, entry){
  const [lo, hi] = rng(e.r);
  if(!entry || !entry.sets.length) return {kind:"new", text:"First time: find a weight for "+lo+"–"+hi, sets:[], head:null};
  const S = entry.sets, topW = Math.max(...S.map(s => +s.w||0));
  if(topW && S.length >= e.s && S.every(s => +s.r >= hi)){
    const w = +(topW + INC()).toFixed(1);
    return {kind:"up", text:"Go up: "+w+" × "+lo, head:{w, r:lo}, sets:Array.from({length:e.s}, () => ({w, r:lo}))};
  }
  const sets = Array.from({length:e.s}, (_,i) => { const p = S[i] || S[S.length-1]; return {w:+p.w||0, r:Math.min(hi, (+p.r||lo) + 1)}; });
  const head = sets.find((s,i) => !S[i] || s.r > +S[i].r) || sets[0];
  return {kind:"rep", text:"Beat it: "+setTxt(head), head, sets};
}
function hitTarget(e, t, sets){
  if(t.kind === "new") return false;
  return t.sets.filter((ts,i) => sets[i] && +sets[i].w >= ts.w && +sets[i].r >= ts.r).length >= e.s;
}
function dayVol(day, d){ return PLAN[day].ex.reduce((a,e) => { const x = (log[e.k]||[]).find(y => y.d === d); return a + (x ? vol(x.sets) : 0); }, 0); }
function weekStart(off){ const m = new Date(now); m.setDate(now.getDate() - dow - 7*(off||0)); return localDate(m); }
function streakWeeks(){
  const dates = Object.keys(done); let n = 0;
  for(let w=0; w<52; w++){
    const a = weekStart(w), b = w ? weekStart(w-1) : "9999";
    const c = dates.filter(d => d >= a && d < b).length;
    if(c >= 3) n++; else if(w > 0) break;
  }
  return n;
}

/* ---------- home ---------- */
function renderHome(){
  const wk = $("#week"); wk.innerHTML = "";
  const monday = new Date(now); monday.setDate(now.getDate()-dow);
  WEEK.forEach((t,i) => {
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    const b = document.createElement("button");
    const isDone = !!done[localDate(d)];
    b.className = "wd" + (i===dow?" today":"") + (t!=="rest"?" train":"") + (isDone?" done":"") + (t===sel && t!=="rest"?" sel":"");
    b.innerHTML = WD[i] + '<span class="n">'+d.getDate()+'</span><span class="dot"></span>';
    b.setAttribute("aria-label", DAYNAME[i]+": "+(t==="rest"?"rest":PLAN[t].title)+(isDone?", done":""));
    if(t==="rest") b.disabled = true; else b.onclick = () => { sel = t; renderHome(); };
    wk.appendChild(b);
  });

  const p = PLAN[sel], isToday = WEEK[dow]===sel;
  const dayIdx = WEEK.indexOf(sel);
  $("#hEyebrow").textContent = done[dateKey]===sel ? "Completed today ✓" : isToday ? "Today's workout" : (WEEK[dow]==="rest" && sel===nextDay() ? "Rest day · up next "+DAYNAME[dayIdx] : DAYNAME[dayIdx]);
  $("#hTitle").textContent = p.title + " day";
  $("#hSub").textContent = p.sub;
  const sets = p.ex.reduce((a,e)=>a+e.s,0);
  $("#hStats").innerHTML = [[p.ex.length,"Exercises"],[sets,"Sets"],["~"+estMin(p),"Minutes"]].map(([b,s]) => '<div class="stat"><b class="d">'+b+'</b><span>'+s+'</span></div>').join("");
  $("#startBtn").textContent = sess && sess.day===sel ? "Resume workout" : "Start workout";

  $("#chips").innerHTML = "";
  Object.keys(PLAN).forEach(k => {
    const c = document.createElement("button"); c.className = "chip"; c.textContent = PLAN[k].title;
    c.setAttribute("aria-pressed", k===sel); c.onclick = () => { sel = k; renderHome(); };
    $("#chips").appendChild(c);
  });

  let h = '<div class="row warm"><div class="i d">0</div><div class="t"><b>Warm-up</b><small>5 min cardio + 2–3 light ramp-up sets</small></div></div>';
  p.ex.forEach((e,i) => {
    const le = lastEntry(e.k), ts = le && topSet(le.sets), t = targetFor(e, le);
    h += '<div class="row" data-i="'+i+'"><div class="i d">'+(i+1)+'</div><div class="t"><b>'+esc(e.n)+'</b><small>'+e.s+' × '+esc(e.r)+' · '+esc(e.g)+'</small></div>'+
         '<div class="last">'+(t.head ? '<span class="tg'+(t.kind==="up"?" up":"")+'">'+setTxt(t.head)+'</span>last '+setTxt(ts) : '<span class="tg">New</span>set a baseline')+'</div></div>';
  });
  $("#list").innerHTML = h;
  renderNudge();
}
function renderNudge(){
  const n = Object.keys(done).length, lb = store.get("ppl-lastbackup", 0);
  const since = Object.keys(done).filter(d => !lb || d >= localDate(new Date(lb))).length;
  const show = n >= 2 && since >= 2 && (!lb || Date.now()-lb > 14*864e5);
  $("#nudge").hidden = !show;
  if(show) $("#nudgeTxt").innerHTML = "<b>"+since+" workouts</b> aren't backed up yet";
}
$("#startBtn").onclick = () => {
  if(!sess || sess.day!==sel){
    if(sess && !confirm("You have an unfinished "+PLAN[sess.day].title+" workout. Discard it and start "+PLAN[sel].title+"?")) return;
    sess = {date:dateKey, day:sel, i:0, start:Date.now(), sets:{}, prs:0};
    saveSess();
  }
  openPlayer();
};

/* ---------- progress ---------- */
function renderProg(){
  const dates = Object.keys(done).sort();
  const monday = new Date(now); monday.setDate(now.getDate()-dow);
  const thisWeek = dates.filter(d => d >= localDate(monday)).length;
  const winsTotal = Object.values(hist).reduce((a,x) => a + (x.wins||[]).length, 0);
  $("#since").textContent = dates.length ? "Since "+new Date(dates[0]+"T12:00").toLocaleDateString(undefined,{month:"short",day:"numeric"}) : "";
  $("#kpis").innerHTML = [[thisWeek+"/3","Week"],[dates.length,"Workouts"],[winsTotal,"Wins"],[streakWeeks(),"Streak"]].map(([b,s]) => '<div class="kpi"><b class="d">'+b+'</b><span>'+s+'</span></div>').join("");

  $("#hlist").innerHTML = dates.length ? dates.slice().reverse().map(d => {
    const day = done[d], dt = new Date(d+"T12:00"), x = hist[d] || {};
    const sets = PLAN[day].ex.reduce((a,e) => { const en = (log[e.k]||[]).find(y => y.d === d); return a + (en ? en.sets.length : 0); }, 0);
    const w = (x.wins||[]).length;
    return '<button class="hrow" data-d="'+d+'"><div class="dt"><b class="d">'+dt.getDate()+'</b><small>'+dt.toLocaleDateString(undefined,{month:"short"})+'</small></div>'+
      '<div class="t"><b>'+PLAN[day].title+' day</b><small>'+dt.toLocaleDateString(undefined,{weekday:"short"})+' · '+sets+' sets · '+Math.round(dayVol(day,d)).toLocaleString()+' '+unit+(x.mins?' · '+x.mins+' min':'')+'</small></div>'+
      (w ? '<span class="w">'+w+' win'+(w>1?'s':'')+'</span>' : '')+'</button>';
  }).join("") : '<div class="empty">Your finished workouts will show up here.</div>';
  $("#hlist").querySelectorAll(".hrow").forEach(b => b.onclick = () => openHist(b.dataset.d));

  const lb = store.get("ppl-lastbackup", 0);
  $("#bkTxt").innerHTML = "Your history only lives in this app. Save a backup to <b>iCloud Drive</b> (Share → Save to Files) so a new phone or a deleted app doesn't wipe it.<br>Last backup: <b>"+(lb ? agoTxt(lb) : "never")+"</b>";
  let h = "";
  Object.keys(PLAN).forEach(k => {
    h += '<div class="sec"><h2 class="d">'+PLAN[k].title+'</h2><span>Best set · trend</span></div>';
    const rows = PLAN[k].ex.map(e => {
      const hist = log[e.k] || [];
      if(!hist.length) return "";
      const all = hist.flatMap(x => x.sets), best = topSet(all);
      const pts = hist.slice(-10).map(x => Math.max(...x.sets.map(s => e1(s.w,s.r))));
      return '<div class="prow"><div class="t"><b>'+esc(e.n)+'</b><small>'+hist.length+' session'+(hist.length>1?'s':'')+' · last '+setTxt(topSet(hist[hist.length-1].sets))+'</small></div>'+spark(pts)+
             '<div class="best"><b class="d">'+setTxt(best)+'</b><small>'+(best && +best.w ? unit+' · best' : 'best')+'</small></div></div>';
    }).join("");
    h += rows || '<div class="empty">Finish a '+PLAN[k].title.toLowerCase()+' workout to see your numbers here.</div>';
  });
  $("#plist").innerHTML = h;
}
function spark(pts){
  if(pts.length < 2) return '<svg viewBox="0 0 84 30"></svg>';
  const mn = Math.min(...pts), mx = Math.max(...pts), rg = (mx-mn) || 1;

/* Working weight = weight of the next set not yet logged (typed value, else the target). */
function workingWeight(){
  const rows = [...$("#pBody").querySelectorAll(".set")];
  const r = rows.find(x => !x.classList.contains("done")) || rows[0];
  const w = r && r.querySelector('input[data-f="w"]');

}
function refreshAux(){
  const e = PLAN[sess.day].ex[sess.i], W = workingWeight();
  if($("#plates")) $("#plates").innerHTML = W ? plateHTML(W) : '<span class="muted">Enter a weight to see the plates.</span>';
  if($("#barBtn")) $("#barBtn").textContent = barW()+" "+unit+" bar ▾";
  if($("#wu")){
    // warm-ups use the first set's weight, not the next unlogged one
    const w1 = $("#pBody").querySelector('.set input[data-f="w"]');
    const top = w1 ? (parseFloat(w1.value) || parseFloat(w1.placeholder) || 0) : 0;
    const sets = warmups(e, top);
    const st = (sess.warm ||= []);
    $("#wu").innerHTML = sets ? sets.map((s,j) => '<button class="wset'+(st[j]?' on':'')+'" data-j="'+j+'"><b>'+(j === 0 ? (isBar(e) ? "Empty bar" : "Light") : s.w)+'</b> × '+s.r+(isBar(e) && s.w > barW() ? '<small>'+plateTxt(s.w)+'</small>' : '')+'</button>').join("")
      : '<span class="muted">Enter your working weight in set 1 to get ramp-up sets.</span>';
    $("#wu").querySelectorAll(".wset").forEach(b => b.onclick = () => { st[+b.dataset.j] = !st[+b.dataset.j]; saveSess(); b.classList.toggle("on", st[+b.dataset.j]); });
  }
}
function logSet(s, row){
  const p = PLAN[sess.day], e = p.ex[sess.i], cur = sess.sets[sess.i], c = cur[s] || (cur[s] = {});
  if(c.done){ c.done = false; saveSess(); renderPlayer(); return; }
  const [wi, ri] = row.querySelectorAll("input");
  const num = el => { const v = parseFloat(el.value || el.placeholder); return isNaN(v) ? 0 : v; };
  if(!prevEntry(e.k) && !wi.value.trim()){ wi.focus(); return; }   // first time: need a real weight
  c.w = String(num(wi)); c.r = String(num(ri) || lowRep(e.r));
  if(!(+c.r)){ ri.focus(); return; }
  const prior = Math.max(bestE(e.k), ...cur.filter((x,j) => x && x.done && j!==s).map(x => e1(x.w,x.r)));
  c.done = true;
  const t = targetFor(e, prevEntry(e.k)), doneSets = cur.filter(x => x && x.done);
  sess.hit = sess.hit || {};
  if((log[e.k]||[]).some(x => x.d !== dateKey) && +c.w && e1(c.w,c.r) > prior + 0.01){ sess.prs++; toast("New PR · "+c.w+" × "+c.r); }
  else if(!sess.hit[sess.i] && hitTarget(e, t, doneSets)){ sess.hit[sess.i] = true; toast("Target hit ✓"); }
  saveSess(); renderPlayer();
  const remaining = cur.filter(x=>x&&x.done).length < e.s;
  const lastEx = sess.i === p.ex.length-1;
  if(remaining) startRest(e.rest, "Set "+(cur.filter(x=>x&&x.done).length+1)+" of "+e.n);
  else if(!lastEx) startRest(e.rest, p.ex[sess.i+1].n, true);
}

      g.gain.setValueAtTime(.2,a.currentTime+t); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.18); o.start(a.currentTime+t); o.stop(a.currentTime+t+.2); });

/* ---------- finish ---------- */
/* Small wins: compare this session against everything logged before today. Called BEFORE the log is written. */
function computeWins(day, sessSets){
  const p = PLAN[day], wins = [];
  const MIL = unit === "kg" ? [40,60,80,100,120,140,160,180,200] : [95,135,185,225,275,315,365,405,455,495];
  let sv = 0;
  p.ex.forEach((e,j) => {
    const sets = sessSets[j]; if(!sets.length) return;
    const v = vol(sets); sv += v;
    const prevH = (log[e.k]||[]).filter(x => x.d !== dateKey); if(!prevH.length) return;
    const prevAll = prevH.flatMap(x => x.sets), top = topSet(sets);
    const maxW = Math.max(...sets.map(s => s.w)), prevMaxW = Math.max(...prevAll.map(s => +s.w||0));
    const mil = MIL.filter(m => maxW >= m && prevMaxW < m).pop();
    if(mil) wins.push({p:0, m:"First "+mil+" "+unit+" "+e.n+"!"});
    if(top.w && e1(top.w,top.r) > Math.max(...prevAll.map(s => e1(s.w,s.r))) + .01){ wins.push({p:1, m:"New PR on "+e.n+": "+top.w+" × "+top.r}); return; }
    let rep = null;
    sets.forEach(s => { const at = prevAll.filter(x => +x.w === s.w); if(!at.length) return; const d = s.r - Math.max(...at.map(x => +x.r)); if(d > 0 && (!rep || d > rep.d)) rep = {w:s.w, d}; });
    if(rep){ wins.push({p:4, m:"+"+rep.d+" rep"+(rep.d>1?"s":"")+" at "+(rep.w ? rep.w+" "+unit : "bodyweight")+" on "+e.n}); return; }
    if(hitTarget(e, targetFor(e, prevH[prevH.length-1]), sets)){ wins.push({p:5, m:"Hit your target on "+e.n}); return; }
    const lv = vol(prevH[prevH.length-1].sets);
    if(lv && v > lv) wins.push({p:6, m:"More volume on "+e.n+" (+"+Math.round((v/lv-1)*100)+"%)"});
  });
  const prevDays = Object.keys(done).filter(d => d !== dateKey && done[d] === day).sort();
  if(!Object.keys(done).some(d => d !== dateKey)) wins.push({p:2, m:"First workout logged. The hardest one's done."});
  else if(prevDays.length){
    const best = Math.max(...prevDays.map(d => dayVol(day, d))), last = dayVol(day, prevDays[prevDays.length-1]);
    if(sv > best) wins.push({p:3, m:"Biggest "+p.title+" day yet: "+Math.round(sv).toLocaleString()+" "+unit});
    else if(last && sv > last) wins.push({p:3, m:"+"+Math.round((sv/last-1)*100)+"% volume vs last "+p.title+" day"});
  }
  const wk = Object.keys(done).filter(d => d >= weekStart(0) && d !== dateKey).length + 1;
  if(wk === 3) wins.push({p:2, m:"3 for 3 this week"});
  return wins.sort((a,b) => a.p - b.p).map(w => w.m);
}
function finish(){
  const p = PLAN[sess.day];
  const sessSets = p.ex.map((e,j) => (sess.sets[j]||[]).filter(x => x && x.done).map(x => ({w:+x.w||0, r:+x.r||0})));
  const setsDone = sessSets.reduce((a,s) => a + s.length, 0), total = sessSets.reduce((a,s) => a + vol(s), 0);
  if(!setsDone && !confirm("No sets logged yet. End the workout anyway?")) return;
  const wins = setsDone ? computeWins(sess.day, sessSets) : [];
  p.ex.forEach((e,j) => {
    const sets = sessSets[j]; if(!sets.length) return;
    const h = log[e.k] || (log[e.k] = []);
    if(h.length && h[h.length-1].d === dateKey) h[h.length-1] = {d:dateKey, sets}; else h.push({d:dateKey, sets});
  });
  const mins = Math.round((Date.now()-sess.start)/60000), prs = wins.filter(w => w.startsWith("New PR")).length;
  if(setsDone){
    done[dateKey] = sess.day;
    const streak = streakWeeks(); if(streak >= 2 && wins.includes("3 for 3 this week")) wins.push(streak+"-week streak");
    hist[dateKey] = {day:sess.day, mins, wins};
    store.set("ppl-done", done); store.set("ppl-log", log); store.set("ppl-hist", hist);
  }
  sess = null; store.del("ppl-session"); closePlayer();
  if(!setsDone) return;
  $("#sTitle").textContent = wins.length ? wins.length+" win"+(wins.length>1?"s":"")+" today" : p.title+" done";
  $("#sWins").innerHTML = wins.map((w,i) => '<div class="win'+(i===0 && /PR|First \d/.test(w) ? ' big' : '')+'"><i>✓</i>'+esc(w)+'</div>').join("") ||
    '<div class="win"><i>✓</i>Showed up and put in the work. That counts.</div>';
  $("#sKpis").innerHTML = [[setsDone,"Sets"],[mins,"Minutes"],[prs,"PRs"]].map(([b,s]) => '<div class="kpi"><b class="d">'+b+'</b><span>'+s+'</span></div>').join("") +
    '<div class="kpi" style="grid-column:1/-1"><b class="d">'+Math.round(total).toLocaleString()+' '+unit+'</b><span>Total volume</span></div>';
  $("#summary").classList.add("open");
}

/* ---------- plates + warm-ups ---------- */
const PLATES = {lb:[45,35,25,10,5,2.5], kg:[25,20,15,10,5,2.5,1.25]};
const BARS = {lb:[45,35,25,15], kg:[20,15,10]};
const isBar = e => /barbell/i.test(e.n);
const barPref = store.get("ppl-bar", {lb:45, kg:20});
const barW = () => barPref[unit] ?? (unit === "kg" ? 20 : 45);
const roundTo = (x, step) => Math.round(x/step)*step;
function plateSplit(total){
  let side = (total - barW())/2; if(side < 0) return null;
  const out = [];
  PLATES[unit].forEach(p => { while(side >= p - 1e-9){ out.push(p); side -= p; } });
  return {plates:out, off:+(side*2).toFixed(2)};
}
function plateTxt(total){ const s = plateSplit(total); return !s ? "under bar" : s.plates.length ? s.plates.join(" + ") : "empty bar"; }
function plateHTML(total){
  const s = plateSplit(total);
  if(!s) return '<span class="muted">'+total+' '+unit+' is lighter than the '+barW()+' '+unit+' bar.</span>';
  const max = PLATES[unit][0];
  const vis = s.plates.map(p => '<i class="pl" style="height:'+Math.round(22 + 46*p/max)+'px">'+p+'</i>').join("");
  return '<div class="bar"><span class="sleeve"></span>'+vis+'<span class="collar"></span></div>'+
    '<div class="ptxt">'+(s.plates.length ? '<b>'+s.plates.join(" + ")+'</b> each side' : '<b>Empty bar</b>')+
    (s.off ? ' <span class="muted">(closest: '+(total - s.off)+' '+unit+')</span>' : '')+'</div>';
}
/* Ramp-up: empty bar/light x10, 50% x5, 70% x3, 85% x1 of the working weight, rounded to loadable jumps. */
function warmups(e, top){
  if(!top) return null;
  const step = unit === "kg" ? 2.5 : 5, bar = isBar(e) ? barW() : 0;
  const out = [{w:bar, r:10}];
  // barbell: keep each side a multiple of 5 lb / 2.5 kg so no tiny plates are needed
  [[.5,5],[.7,3],[.85,1]].forEach(([f,r]) => { const w = isBar(e) ? Math.max(bar, bar + roundTo(top*f - bar, step*2)) : roundTo(top*f, step); if(w > out[out.length-1].w && w < top) out.push({w, r}); });
  return out;
}
function openPlates(start){
  const W = start || (sess ? workingWeight() : 0) || (unit === "kg" ? 60 : 135);
  $("#hCard").innerHTML = '<div class="eyebrow">Plate calculator</div><h3 class="d" style="font-size:40px;margin:6px 0 12px">Load the bar</h3>'+
    '<label class="hx" for="pcIn" style="display:block">Total weight ('+unit+')</label>'+
    '<input id="pcIn" class="pcin" inputmode="decimal" value="'+W+'">'+
    '<div class="hx">Bar</div><div class="chips" id="pcBars" style="margin:0 0 14px"></div>'+
    '<div id="pcOut"></div>'+
    '<p class="muted" style="font-size:12px;margin:12px 0 0">Smith machines at Planet Fitness usually have a lighter bar, around 15–25 lb. Pick the closest.</p>'+
    '<div class="btnrow"><button class="pri" id="pcClose">Done</button></div>';
  const draw = () => {
    $("#pcBars").innerHTML = BARS[unit].map(b => '<button class="chip" aria-pressed="'+(b===barW())+'" data-b="'+b+'">'+b+' '+unit+'</button>').join("");
    $("#pcBars").querySelectorAll(".chip").forEach(c => c.onclick = () => { barPref[unit] = +c.dataset.b; store.set("ppl-bar", barPref); draw(); if(sess && $("#player").classList.contains("open")) refreshAux(); });
    const v = parseFloat($("#pcIn").value);

  $("#hModal").classList.add("open"); draw();

  $("#hSave").onclick = () => {
    const by = {};
    $("#hCard").querySelectorAll(".hset").forEach(r => { const [w, rp] = r.querySelectorAll("input"); const reps = parseFloat(rp.value); if(reps > 0) (by[r.dataset.k] ||= []).push({w:parseFloat(w.value)||0, r:reps}); });
    PLAN[day].ex.forEach(e => {
      const h2 = log[e.k] || [], i = h2.findIndex(y => y.d === d); if(i < 0) return;
      if(by[e.k]) h2[i] = {d, sets:by[e.k]}; else h2.splice(i, 1);
    });
    if(!PLAN[day].ex.some(e => (log[e.k]||[]).some(y => y.d === d))){ delete done[d]; delete hist[d]; }
    store.set("ppl-log", log); store.set("ppl-done", done); store.set("ppl-hist", hist);
    $("#hModal").classList.remove("open"); toast("Saved"); renderAll();
  };
  $("#hDel").onclick = () => {
    if(!confirm("Delete this "+PLAN[day].title+" workout and its sets?")) return;
    PLAN[day].ex.forEach(e => { if(log[e.k]) log[e.k] = log[e.k].filter(y => y.d !== d); });
    delete done[d]; delete hist[d];
    store.set("ppl-log", log); store.set("ppl-done", done); store.set("ppl-hist", hist);
    $("#hModal").classList.remove("open"); renderAll();
  };
}
$("#hModal").onclick = ev => { if(ev.target.id === "hModal") $("#hModal").classList.remove("open"); };

/* ---------- backup / restore ---------- */
function agoTxt(ts){ const d = Math.floor((Date.now()-ts)/864e5); return d <= 0 ? "today" : d === 1 ? "yesterday" : d+" days ago"; }
async function backup(){
  const data = {app:"ppl-workout", v:1, exported:new Date().toISOString(), unit, log, done, notes, hist};
  const name = "ppl-backup-"+dateKey+".json";
  const blob = new Blob([JSON.stringify(data)], {type:"application/json"});
  try{
    const file = new File([blob], name, {type:"application/json"});
    if(navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file], title:"PPL backup"});
    else { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
    store.set("ppl-lastbackup", Date.now()); toast("Backup saved"); renderAll();
  }catch(e){ if(!e || e.name !== "AbortError") alert("Backup didn't finish: "+(e && e.message || e)); }
}
$("#bkBtn").onclick = backup;
$("#nudgeBtn").onclick = backup;
$("#rsBtn").onclick = () => $("#rsFile").click();
$("#rsFile").onchange = async ev => {
  const f = ev.target.files[0]; ev.target.value = ""; if(!f) return;
  try{
    const data = JSON.parse(await f.text());
    if(data.app !== "ppl-workout" || typeof data.log !== "object" || typeof data.done !== "object") throw new Error("That file isn't a PPL backup.");
    const n = Object.keys(data.done).length;
    if(!confirm("Restore "+n+" workout"+(n===1?"":"s")+" from "+new Date(data.exported).toLocaleDateString()+"? This replaces what's in the app now.")) return;
    log = data.log; done = data.done; notes = data.notes || {}; hist = data.hist || {};
    if(data.unit){ unit = data.unit; store.set("ppl-unit", unit); $("#unitBtn").textContent = unit.toUpperCase(); }
    store.set("ppl-log", log); store.set("ppl-done", done); store.set("ppl-notes", notes); store.set("ppl-hist", hist);
    toast("Restored"); renderAll();
  }catch(e){ alert("Couldn't restore: "+e.message); }
};
$("#sDone").onclick = () => { $("#summary").classList.remove("open"); renderAll(); };

let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600); try{ navigator.vibrate && navigator.vibrate([60,40,60,40,120]); }catch(e){} }

function renderAll(){ renderHome(); if(!$("#vProg").hidden) renderProg(); }
renderHome();

/* ---------- install as app ---------- */
const standalone = navigator.standalone || matchMedia("(display-mode: standalone)").matches;
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
if(isIOS && !standalone && !store.get("ppl-install-x", false)) $("#install").hidden = false;
$("#installX").onclick = () => { $("#install").hidden = true; store.set("ppl-install-x", true); };
if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
// persistent storage so iOS doesn't evict workout history
try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){}
